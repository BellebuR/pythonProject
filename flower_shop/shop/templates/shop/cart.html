<!-- templates/shop/cart.html -->

<div id="cart" style="position:fixed; right:0; width:33%; height:100%; background-color:white; border-left: 1px solid #ccc; display:none;">
    <h2>Корзина</h2>
    <ul>
        {% for item in cart_items %}
            <li>
                {{ item.product.name }} - {{ item.quantity }} x {{ item.product.price }} = {{ item.get_total_price }}
                <a href="{% url 'remove_from_cart' item.id %}">Удалить</a>
            </li>
        {% endfor %}
    </ul>
    <h3>Итого: {{ total_price }}</h3>
    <button onclick="hideCart()">Скрыть</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const addToCartButtons = document.querySelectorAll('.add-to-cart');

    addToCartButtons.forEach(button => {
        button.addEventListener('click', function() {
            const productId = this.getAttribute('data-id');
            const url = `/add-to-cart/${productId}/`; // Убедитесь, что этот URL соответствует вашему маршруту

            fetch(url, { method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') } })
                .then(response => {
                    if (response.ok) {
                        // Успешно добавлено в корзину
                        alert('Товар добавлен в корзину!');
                    }
                })
                .catch(error => console.error('Ошибка:', error));
        });
    });
});

// Функция для получения CSRF токена
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
